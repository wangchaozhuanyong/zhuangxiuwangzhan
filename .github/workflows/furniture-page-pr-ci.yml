name: Furniture page PR checks

# No paths filter: a required check must report a result for every PR to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: furniture-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  furniture-page-pr-checks:
    name: furniture-page-pr-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out the exact PR Head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Verify candidate identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'candidate_head=%s\nbase_sha=%s\n' "$EXPECTED_HEAD" "$EXPECTED_BASE"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check types
        run: npm run typecheck

      - name: Check language integrity
        run: npm run i18n:check

      - name: Lint furniture page and translations
        run: npm exec --no -- eslint src/pages/FurnitureShowcase.tsx src/i18n/furnitureText.ts

      - name: Test furniture catalog
        run: npm test -- src/lib/furnitureCatalog.test.ts

      - name: Build without production configuration
        run: npm run build:dev

      - name: Check architecture and release controls
        run: |
          npm run arch:check
          node --test scripts/pages-release.test.mjs
