name: C1 production read-only verification
on:
  push:
    branches: [codex/c1-preview-recheck-20261115]
    paths: [.github/workflows/c1-preview-recheck.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check C1 production responses and content
        run: |
          mkdir -p c1-evidence
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          const cases = [{"path":"/en/locations/kuala-lumpur/kitchen-renovation","status":200,"title":"Kitchen Renovation Kuala Lumpur | FLASH CAST","copy":{"heading":"Kitchen Renovation in Kuala Lumpur","body":["For a Kuala Lumpur condo kitchen, start with the existing water supply, drainage, power points and extractor route. If your landed home has a wet and dry kitchen, decide where you will wash, prep and cook before settling on cabinet and worktop dimensions.","Send current photos, a floor plan or approximate measurements, and a list of appliances you want to keep. If the sink, sockets or extractor route may move, ask for those works to be itemised separately from cabinetry, worktops and installation. The final scope follows a site review and the written quotation."]}},{"path":"/zh/locations/kuala-lumpur/kitchen-renovation","status":200,"title":"吉隆坡厨房装修｜定制橱柜｜FLASH CAST","copy":{"heading":"吉隆坡厨房装修","body":["吉隆坡公寓的厨房可以先按现有给排水、电源和排烟位置来规划。需要兼顾干湿厨房的有地住宅，可先决定哪里洗切、哪里烹煮，以及备餐台和日常电器放在哪里，再确认柜体和台面的尺寸。","询价时，请提供现况照片、平面图或大致尺寸，并标出要保留的电器。若需要移动水槽、插座或排烟位置，可请我们在报价中把水电调整与柜体、台面及安装分别列清。实际做法以现场复核和书面报价为准。"]}},{"path":"/ms/locations/kuala-lumpur/kitchen-renovation","status":200,"title":"Pengubahsuaian Dapur Kuala Lumpur | FLASH CAST","copy":{"heading":"Pengubahsuaian Dapur di Kuala Lumpur","body":["Untuk dapur kondominium di Kuala Lumpur, mulakan dengan menyemak bekalan air, saliran, soket dan laluan salur penyedut asap dapur sedia ada. Jika rumah bertanah anda mempunyai dapur basah dan dapur kering, tentukan ruang untuk membasuh, menyediakan bahan dan memasak sebelum menetapkan ukuran kabinet dan permukaan kerja.","Hantar gambar keadaan semasa, pelan lantai atau anggaran ukuran, serta senarai peralatan yang ingin dikekalkan. Jika sinki, soket atau salur penyedut asap mungkin perlu dialihkan, minta kerja berkenaan disenaraikan berasingan daripada kabinet, permukaan kerja dan pemasangan. Skop akhir tertakluk pada semakan tapak dan sebut harga bertulis."]}},{"path":"/en/locations/kuala-lumpur/office-renovation","status":200,"title":"Office Renovation Kuala Lumpur | Fit-Out | FLASH CAST","copy":{"heading":"Office Renovation in Kuala Lumpur","body":["For a Kuala Lumpur office fit-out, list headcount, equipment and network needs by reception area, meeting room and workstation. If the team will remain on site during the works, identify areas that must stay operational so the sequence and any downtime can be discussed early.","Send the floor plan, site photos and equipment list, along with the building's work hours, loading route and goods-lift arrangements. Compare quotations by checking partitions, lighting, power and data points, air-conditioning coordination and any handover documents. Mark the equipment your team will supply."]}},{"path":"/zh/locations/kuala-lumpur/office-renovation","status":200,"title":"吉隆坡办公室装修｜办公室精装｜FLASH CAST","copy":{"heading":"吉隆坡办公室装修","body":["在吉隆坡规划办公室装修时，可先按接待区、会议室和工位列出人数、设备和网络需求。若团队会在施工期间继续使用办公室，请标出必须维持运作的区域，再讨论施工顺序和可行的停用时段。","把平面图、现场照片和设备清单发给我们，并补充大楼允许的施工时间、进场路线和货梯安排。比较报价时，可逐项确认隔墙、照明、电源与网络点、空调配合及交付文件，并注明哪些设备由你方提供。"]}},{"path":"/ms/locations/kuala-lumpur/office-renovation","status":200,"title":"Pengubahsuaian Pejabat KL | Fit-Out | FLASH CAST","copy":{"heading":"Pengubahsuaian Pejabat di Kuala Lumpur","body":["Untuk pengubahsuaian pejabat di Kuala Lumpur, senaraikan bilangan pengguna, peralatan dan keperluan rangkaian bagi ruang lobi, bilik mesyuarat dan ruang kerja. Jika pasukan anda masih bekerja di pejabat semasa pengubahsuaian, tandakan ruang yang mesti kekal beroperasi supaya urutan kerja dan tempoh gangguan boleh dibincangkan lebih awal.","Hantar pelan lantai, gambar tapak dan senarai peralatan bersama waktu kerja yang dibenarkan, laluan penghantaran dan aturan lif barang. Semasa membandingkan sebut harga, semak skop dinding pemisah, pencahayaan, titik kuasa dan data, penyelarasan penyaman udara serta dokumen serahan. Nyatakan peralatan yang dibekalkan oleh pihak anda."]}},{"path":"/en/locations/kuala-lumpur/bathroom-renovation","status":200,"title":"Bathroom Renovation Kuala Lumpur | FLASH CAST","copy":{"heading":"Bathroom Renovation in Kuala Lumpur","body":["If you notice a bathroom leak, record where it appears, when you first saw it and whether it follows showering or other water use. Photograph the floor drain, wall-to-floor junctions and affected areas. Let us know if you have another working bathroom so access and daily use can be discussed before work starts.","After the site review, ask for demolition, plumbing, waterproofing, tiling and fittings to be listed separately. Confirm what can stay in place, whether concealed pipes need replacement, and whether the agreed scope includes a ponding test and its record."]}},{"path":"/zh/locations/kuala-lumpur/bathroom-renovation","status":200,"title":"吉隆坡浴室装修｜防水与暗管更换｜FLASH CAST","copy":{"heading":"吉隆坡浴室装修","body":["如果浴室出现渗水，请记录水迹的位置、出现时间，以及与洗澡或用水的关系。拍下地漏、墙地交接处和受影响区域，并说明家里是否有另一间可用的浴室。这些资料有助于安排现场检查和讨论施工期间的使用安排。","现场确认后，可请我们在书面报价中分列拆除、管道、防水、铺砖和洁具。保留哪些洁具、是否需要更换暗管、是否包含闭水测试和记录，应随现场评估一并确认。"]}},{"path":"/ms/locations/kuala-lumpur/bathroom-renovation","status":200,"title":"Pengubahsuaian Bilik Air KL | FLASH CAST","copy":{"heading":"Pengubahsuaian Bilik Air di Kuala Lumpur","body":["Jika bilik air menunjukkan tanda kebocoran, catat lokasi kesan air, bila ia mula kelihatan dan sama ada ia berlaku selepas mandi atau penggunaan air yang lain. Ambil gambar perangkap lantai, sambungan dinding dengan lantai dan kawasan yang terjejas. Maklumkan jika ada bilik air lain yang boleh digunakan sepanjang kerja.","Selepas semakan tapak, minta kerja perobohan, paip, kalis air, pemasangan jubin dan kelengkapan disenaraikan berasingan. Sahkan kelengkapan yang boleh dikekalkan, sama ada paip tersembunyi perlu diganti, dan sama ada skop yang dipersetujui merangkumi ujian takungan air serta rekodnya."]}},{"path":"/en/locations/petaling-jaya/condo-renovation","status":200,"title":"Condo Renovation Petaling Jaya | FLASH CAST","copy":{"heading":"Condo Renovation in Petaling Jaya","body":["Before renovating a Petaling Jaya condo, ask the management office about application documents, working hours, service-lift bookings and protection for common areas. Keep those instructions with the unit plan so delivery and work sequencing can be discussed against the building's requirements.","Mark any partitions, flooring, storage, power, plumbing and air-conditioning points you want to change, plus the fittings you want to retain. Use that list for the quotation and flag any items still awaiting management or site confirmation. Requirements depend on your building and the actual unit."]}},{"path":"/zh/locations/petaling-jaya/condo-renovation","status":200,"title":"八打灵再也公寓装修｜管理处审批｜FLASH CAST","copy":{"heading":"八打灵再也公寓装修","body":["装修八打灵再也的公寓前，可向管理处确认申请材料、可施工时段、订用货梯以及公共区域保护的要求。把这些要求和单位平面图放在一起，有助于安排材料进场，也能及早发现影响施工顺序的条件。","请标出想调整的隔间、地面、收纳、水电和空调位置，以及希望保留的设施。询价时可先确认施工项目，再列出有待管理处或现场核实的事项。具体要求以该楼管理方回复及现场评估为准。"]}},{"path":"/ms/locations/petaling-jaya/condo-renovation","status":200,"title":"Pengubahsuaian Kondominium PJ | FLASH CAST","copy":{"heading":"Pengubahsuaian Kondominium di Petaling Jaya","body":["Sebelum mengubah suai kondominium di Petaling Jaya, tanya pejabat pengurusan tentang dokumen permohonan, waktu kerja, tempahan lif barang dan perlindungan kawasan umum. Simpan arahan itu bersama pelan unit supaya penghantaran bahan dan urutan kerja boleh dibincangkan mengikut keadaan bangunan.","Tandakan dinding pemisah, lantai, ruang simpanan, titik elektrik, paip dan kedudukan penyaman udara yang ingin diubah. Sertakan kelengkapan yang ingin dikekalkan. Gunakan senarai itu untuk sebut harga dan nyatakan perkara yang masih memerlukan pengesahan daripada pihak pengurusan atau semakan tapak."]}},{"path":"/en/locations/selangor/landed-house-renovation","status":200,"title":"Landed House Renovation Selangor | FLASH CAST","copy":{"heading":"Landed House Renovation in Selangor","body":["If you are planning to renovate a terrace house, semi-detached home or bungalow in Selangor, mark the rooms you want to change and any proposed extension on the existing floor plan. For work beyond the current building footprint, check what drawings and approvals the relevant local authority expects before discussing the work scope.","Share your neighbourhood, current photos, and the rooms or fittings you want to keep. Review layout changes, wiring, plumbing, wet works and reinstatement separately so the quotation can identify confirmed work and items awaiting inspection. Site visits, scope and timing depend on the address and site conditions."]}},{"path":"/zh/locations/selangor/landed-house-renovation","status":200,"title":"雪兰莪有地住宅装修｜排屋与洋房｜FLASH CAST","copy":{"heading":"雪兰莪有地住宅装修","body":["如果你计划翻新雪兰莪的排屋、半独立式住宅或独立屋，请在原平面图上标出想改动的室内区域和计划扩建的位置。涉及外部范围时，可以先确认当地主管部门要求什么图纸和审批，再与我们讨论相应的工作范围。","请提供所在地区、现况照片和要保留的房间或设施。评估时可把格局调整、布线、管道、湿作业和复原分别列项，便于确认哪些须先检查和哪些已计入报价。上门安排、范围和工期以实际地点及现场条件为准。"]}},{"path":"/ms/locations/selangor/landed-house-renovation","status":200,"title":"Pengubahsuaian Rumah Teres Selangor | FLASH CAST","copy":{"heading":"Pengubahsuaian Rumah Bertanah di Selangor","body":["Jika anda merancang pengubahsuaian rumah teres, rumah berkembar atau banglo di Selangor, tandakan ruang yang ingin diubah dan cadangan tambahan ruang pada pelan lantai sedia ada. Untuk kerja yang melibatkan tambahan di luar bangunan asal, semak keperluan lukisan dan kelulusan dengan pihak berkuasa tempatan sebelum membincangkan skop kerja.","Maklumkan kawasan tempat rumah anda berada, gambar semasa, serta ruang atau kelengkapan yang ingin dikekalkan. Semak perubahan susun atur, pendawaian, paip, kerja basah dan kerja pemulihan secara berasingan supaya sebut harga dapat menunjukkan kerja yang telah dikenal pasti dan perkara yang masih menunggu pemeriksaan. Lawatan tapak, skop dan jadual tertakluk pada alamat serta keadaan sebenar tapak."]}},{"path":"/en/locations/kuala-lumpur/nonexistent","status":404},{"path":"/en/locations/nowhere/kitchen-renovation","status":404},{"path":"/en/locations/kuala-lumpur/kitchen-renovation/extra","status":404},{"path":"/en/locations/kuala-lumpur","status":200},{"path":"/zh/locations/kuala-lumpur","status":200},{"path":"/en/services/kitchen","status":200},{"path":"/zh/services/kitchen","status":200}];
          const origin = 'https://flashcast.com.my';
          const read = path => fetch(origin + path, {redirect:'manual', signal:AbortSignal.timeout(12000)});
          const decode = html => html.replace(/&#(?:x([0-9a-f]+)|(\d+));/gi, (whole, hex, dec) => {
            const code = hex ? parseInt(hex,16) : Number(dec);
            return code >= 0 && code <= 0x10ffff ? String.fromCodePoint(code) : whole;
          }).replace(/&(amp|quot|apos|lt|gt|nbsp);/g, (_,key) => ({amp:'&',quot:'"',apos:"'",lt:'<',gt:'>',nbsp:' '})[key]);
          const normalize = value => value.replace(/\s+/g,' ').trim();
          const results = [];
          const inspect = async item => {
            const row = { path:item.path, expected:item.status, checks:[] };
            try {
              const res = await read(item.path);
              row.status = res.status;
              const html = await res.text();
              row.title = decode(html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i)?.[1] ?? '').trim();
              if (row.status !== item.status) row.checks.push('unexpected HTTP status');
              if (item.copy) {
                const visible = normalize(decode(html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<[^>]*>/g,' ')));
                row.heading = visible.includes(normalize(item.copy.heading));
                row.bodyParagraphs = item.copy.body.filter(p => visible.includes(normalize(p))).length;
                row.hreflang = ['en','zh-CN','ms-MY'].every(locale=>html.includes('hreflang="'+locale+'"'));
                if (row.title !== item.title) row.checks.push('unexpected HTML title');
                if (!row.heading || row.bodyParagraphs !== item.copy.body.length) row.checks.push('reviewed copy missing from public HTML');
                if (!row.hreflang) row.checks.push('missing alternate language');
                const canonical = html.match(/<link\s[^>]*rel=["']canonical["'][^>]*>/i)?.[0];
                if (!canonical?.includes(origin+item.path)) row.checks.push('unexpected canonical');
              }
            } catch(error) { row.checks.push(String(error.cause || error)); }
            return row;
          };
          for (let i=0; i<cases.length; i+=4) results.push(...await Promise.all(cases.slice(i,i+4).map(inspect)));
          let sitemapStatus, missingSitemap = [];
          let sitemapError;
          try {
            const response=await read('/sitemap.xml');
            sitemapStatus=response.status;
            const sitemap=await response.text();
            missingSitemap=cases.filter(item=>item.copy&&!sitemap.includes('<loc>'+origin+item.path+'</loc>')).map(item=>item.path);
          } catch(error) { sitemapError=String(error.cause||error); }
          const report={origin,total:results.length,results,sitemapStatus,missingSitemap,sitemapError};
          await writeFile('c1-evidence/production-http.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          assert.equal(results.filter(row=>row.checks.length).length,0);
          assert.equal(sitemapStatus,200);
          assert.equal(missingSitemap.length,0);
          NODE
      - name: Save the production HTTP verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-production-read-only-verification
          path: c1-evidence/production-http.json
          if-no-files-found: warn
          retention-days: 14
