name: FLASH CAST cloud encrypted backup

on:
  schedule:
    # 19:00 UTC = 03:00 Asia/Kuala_Lumpur the following day.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashcast-cloud-recovery-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'wangchaozhuanyong/zhuangxiuwangzhan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install native PostgreSQL 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
      - name: Validate backup controls
        run: |
          node --test scripts/cloud-backup.test.mjs scripts/backup-offsite.test.mjs scripts/backup-retention.test.mjs scripts/private-backup.test.mjs scripts/pages-release.test.mjs
          npm run arch:check
      - name: Create encrypted backup and verify private R2 readback
        env:
          APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/backup-supabase-cloud.mjs
      # No backup, environment file or recovery data is uploaded as a GitHub artifact.
