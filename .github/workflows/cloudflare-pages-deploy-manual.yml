name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact latest main SHA with all release CI successful"
        required: true
        type: string
      approval_id:
        description: "Single-use policy permit for this exact site release"
        required: true
        type: string

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PRODUCTION_BRANCH: main
  RELEASE_SOURCE_BRANCH: ${{ github.ref_name }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
      package_sha256: ${{ steps.freeze.outputs.package_sha256 }}
    steps:
      - name: Checkout requested main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify production release source
        run: npm run release:guard

      - name: Prepare release evidence
        env:
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          test -n "$APPROVAL_ID"
          test "$APPROVAL_ID" != "owner-standing-flashcast-site-publish-20260906"
          mkdir "$RUNNER_TEMP/pages-release"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/pages-release/authorization.json", JSON.stringify({ approvalId: process.env.APPROVAL_ID, sourceSha: process.env.RELEASE_SOURCE_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT }))'

      - name: Verify successful final main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pages-release-evidence.mjs ci "$RUNNER_TEMP/pages-release/main-ci.json"

      - name: Capture current production rollback deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: node scripts/pages-release-evidence.mjs deployment "$RUNNER_TEMP/pages-release/previous-deployment.json"

      - name: Install dependencies
        run: npm ci

      - name: Restore retained hashed assets cache
        uses: actions/cache/restore@v5
        with:
          path: .deploy-cache/assets
          key: cloudflare-pages-assets-${{ github.run_id }}
          restore-keys: |
            cloudflare-pages-assets-

      - name: Stable release check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_SITE_URL: https://flashcast.com.my
          VITE_SITE_EMAIL: support@flashcast.com.my
          VITE_SITE_PHONE_DISPLAY: "+60 11-2885 3888"
          VITE_SITE_PHONE_E164: "+601128853888"
          VITE_SITE_WHATSAPP_NUMBER: "601128853888"
          VITE_SITE_SSM_NUMBER: "202501027419 (1628831-M)"
          VITE_SITE_ADDRESS: "94, Jalan Mega Mendung, Taman United, 58200 Kuala Lumpur, Malaysia"
          VITE_SITE_SHORT_ADDRESS: "94, Jalan Mega Mendung, 58200"
          VITE_GOOGLE_ADS_WHATSAPP_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_WHATSAPP_CONVERSION_LABEL }}
          VITE_GOOGLE_ADS_QUOTE_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_QUOTE_CONVERSION_LABEL }}
          VITE_GOOGLE_ADS_CONTACT_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_CONTACT_CONVERSION_LABEL }}
          VITE_APP_VERSION: ${{ inputs.source_sha }}
        run: npm run release:check

      - name: Compile complete Pages Functions and routing
        run: node scripts/pages-release-evidence.mjs compile "$RUNNER_TEMP/pages-release/previous-deployment.json"

      - name: Confirm release source is unchanged after build
        run: npm run release:guard -- --allow-generated-output

      - name: Freeze complete upload input
        id: freeze
        run: |
          node scripts/pages-release-evidence.mjs freeze dist "$RUNNER_TEMP/pages-release/manifest.json"
          node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); fs.writeFileSync(process.env.RUNNER_TEMP + "/pages-release/build.json", JSON.stringify({sourceSha: process.env.RELEASE_SOURCE_SHA, node: process.version, wrangler: JSON.parse(fs.readFileSync("node_modules/wrangler/package.json")).version, lockSha256: crypto.createHash("sha256").update(fs.readFileSync("package-lock.json")).digest("hex")}))'
          tar -czf "$RUNNER_TEMP/pages-release/deployment.tar.gz" -C dist .
          cd "$RUNNER_TEMP/pages-release"
          sha256sum deployment.tar.gz > deployment.tar.gz.sha256
          echo "package_sha256=$(sha256sum deployment.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Archive immutable complete release
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-release/
          if-no-files-found: error
          retention-days: 90

      - name: Save retained hashed assets
        uses: actions/cache/save@v5
        with:
          path: .deploy-cache/assets
          key: cloudflare-pages-assets-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification tools at the same main SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify production release source
        run: npm run release:guard

      - name: Install locked deployment tooling
        run: npm ci

      - name: Download the immutable release by artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pages-release

      - name: Verify archive and extract to isolated upload directory
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          cd "$RUNNER_TEMP/pages-release"
          sha256sum --check deployment.tar.gz.sha256
          test "$(sha256sum deployment.tar.gz | cut -d ' ' -f 1)" = "$EXPECTED_PACKAGE_SHA256"
          node -e 'require("node:fs").writeFileSync("artifact-identity.json", JSON.stringify({id: process.env.ARTIFACT_ID, digest: process.env.ARTIFACT_DIGEST, packageSha256: process.env.EXPECTED_PACKAGE_SHA256, sourceSha: process.env.RELEASE_SOURCE_SHA}))'
          mkdir "$RUNNER_TEMP/pages-upload" "$RUNNER_TEMP/pages-deployer"
          tar -xzf deployment.tar.gz -C "$RUNNER_TEMP/pages-upload"
          cd "$GITHUB_WORKSPACE"
          node scripts/pages-release-evidence.mjs verify "$RUNNER_TEMP/pages-upload" "$RUNNER_TEMP/pages-release/manifest.json"

      - name: Recheck main CI and rollback baseline immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          node scripts/pages-release-evidence.mjs ci "$RUNNER_TEMP/pages-release/deploy-ci.json"
          node scripts/pages-release-evidence.mjs deployment "$RUNNER_TEMP/pages-release/before-upload.json"
          node -e 'const fs = require("node:fs"); const p = process.env.RUNNER_TEMP + "/pages-release/"; const before = JSON.parse(fs.readFileSync(p + "previous-deployment.json")); const now = JSON.parse(fs.readFileSync(p + "before-upload.json")); require("node:assert/strict").equal(now.deploymentId, before.deploymentId, "Production changed during build; stop"); require("node:assert/strict").deepEqual(now.runtime, before.runtime, "Runtime configuration changed; stop")'
          npm run release:guard

      - name: Deploy verified archived input without rebundling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/pages-upload" --cwd "$RUNNER_TEMP/pages-deployer" --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch main --commit-hash "$RELEASE_SOURCE_SHA" --no-bundle --env-file /dev/null
          node scripts/pages-release-evidence.mjs verify "$RUNNER_TEMP/pages-upload" "$RUNNER_TEMP/pages-release/manifest.json"

      - name: Record deployed identity and public version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.source_sha }}
        run: |
          node scripts/pages-release-evidence.mjs deployment "$RUNNER_TEMP/pages-release/deployed.json"

      - name: Preserve deployment evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-release/*.json
          if-no-files-found: warn
          retention-days: 90
