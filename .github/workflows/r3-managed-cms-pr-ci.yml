name: R3 managed CMS PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/r3-managed-cms-pr-ci.yml
      - .env.example
      - .github/workflows/content-publish-approved.yml
      - .github/workflows/supabase-content-publish-r3.yml
      - scripts/managed-cms-targets-r3-v2.mjs
      - scripts/managed-cms-targets-org020-v7.mjs
      - scripts/publish-content-trust-fixes.mjs
      - scripts/supabase-content-publish-release.mjs
      - scripts/supabase-content-publish-release.test.mjs
      - src/lib/contentPublishService.test.ts
      - src/lib/contentPublishOrg020V7.test.ts
      - src/lib/contentPublishServiceArea.test.ts
      - src/lib/githubOidcPermit.test.ts
      - src/lib/managedContentPublishWorkflow.test.ts
      - src/lib/managedPermitAuth.test.ts
      - src/lib/managedPermitIssuer.test.ts
      - src/lib/managedTimestamp.test.ts
      - src/lib/topicClusterBlogRecordsScript.test.ts
      - supabase/functions/content-publish/github-oidc.ts
      - supabase/functions/content-publish/index.ts
      - supabase/functions/content-publish/managed-targets.ts
      - supabase/functions/content-publish/org020-v7-targets.ts
      - supabase/functions/content-publish/managed-timestamp.ts
      - supabase/functions/content-publish/permit-auth.ts
      - supabase/functions/content-publish/permit-issuer.ts
      - supabase/functions/content-publish/service.ts
      - supabase/functions/content-publish/types.ts
      - supabase/migrations/20260921194000_managed_cms_release_permits.sql
      - supabase/tests/managed_cms_release_permits.sql

permissions:
  contents: read

jobs:
  r3-managed-cms-pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject fork before using public site build configuration
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: test "$PR_HEAD_REPO" = "$REPOSITORY"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify checked-out candidate SHA
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Validate types, lint, and architecture
        run: |
          npm run typecheck
          npm run lint
          npm run arch:check

      - name: Run focused managed CMS tests
        run: |
          npm test -- \
            src/lib/contentPublishOrg020V7.test.ts \
            src/lib/contentPublishServiceArea.test.ts \
            src/lib/contentPublishService.test.ts \
            src/lib/topicClusterBlogRecordsScript.test.ts \
            src/lib/githubOidcPermit.test.ts \
            src/lib/managedContentPublishWorkflow.test.ts \
            src/lib/managedPermitAuth.test.ts \
            src/lib/managedPermitIssuer.test.ts \
            src/lib/managedTimestamp.test.ts

      - name: Run Supabase release gate tests without linking production
        run: |
          node --check scripts/supabase-content-publish-release.mjs
          node --test scripts/supabase-content-publish-release.test.mjs

      - name: Strict build and verify the current Head artifacts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://flashcast.com.my
          VITE_SITE_EMAIL: support@flashcast.com.my
          VITE_SITE_PHONE_DISPLAY: "+60 11-2885 3888"
          VITE_SITE_PHONE_E164: "+601128853888"
          VITE_SITE_WHATSAPP_NUMBER: "601128853888"
          VITE_SITE_SSM_NUMBER: "202501027419 (1628831-M)"
          VITE_SITE_ADDRESS: "94, Jalan Mega Mendung, Taman United, 58200 Kuala Lumpur, Malaysia"
          VITE_SITE_SHORT_ADDRESS: "94, Jalan Mega Mendung, 58200"
          VITE_APP_VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          npm run build
          node scripts/pages-release.mjs record
          node scripts/pages-release.mjs verify-build
