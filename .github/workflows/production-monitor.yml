name: Production website monitoring

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor-${{ github.repository }}
  cancel-in-progress: false

env:
  MONITOR_BASE_URL: https://flashcast.com.my

jobs:
  lightweight:
    name: Availability, TLS, routes and backend health
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run lightweight production monitor
        id: monitor
        continue-on-error: true
        env:
          MONITOR_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          MONITOR_REPORT_PATH: monitor-report.json
        run: node scripts/monitor-production-site.mjs

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-monitor-${{ github.run_id }}
          path: monitor-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open, update or close availability incident
        id: incident
        if: always()
        uses: actions/github-script@v9
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          MONITOR_REPORT_PATH: monitor-report.json
          MONITOR_BASE_URL: ${{ env.MONITOR_BASE_URL }}
        with:
          result-encoding: string
          script: |
            const fs = require('node:fs');
            const marker = '<!-- flashcast-monitor:availability -->';
            const title = '[Website Monitoring] FLASH CAST Production Site Incident';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.MONITOR_OUTCOME !== 'success';
            let report = null;

            try {
              report = JSON.parse(fs.readFileSync(process.env.MONITOR_REPORT_PATH, 'utf8'));
            } catch (error) {
              core.warning(`Unable to read monitor report: ${error.message}`);
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.body?.includes(marker));

            if (failed) {
              const failedChecks = (report?.checks || [])
                .filter((item) => item.status === 'fail')
                .slice(0, 12)
                .map((item) => `- **${item.name}**: ${item.message}`)
                .join('\n') || '- The monitor did not generate a readable report. Open the workflow logs for details.';
              const body = [
                marker,
                '## FLASH CAST Production Site Alert',
                '',
                `- Site: ${process.env.MONITOR_BASE_URL}`,
                `- Last detected: ${report?.checkedAt || new Date().toISOString()}`,
                `- GitHub Actions run: ${runUrl}`,
                `- Failed checks: ${report?.summary?.failed ?? 'unknown'}`,
                '',
                '### Failed checks',
                failedChecks,
                '',
                'This issue will be updated while the incident continues and closed automatically after recovery is confirmed.',
              ].join('\n');

              if (incident) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  title,
                  body,
                });
                return 'ongoing_failure';
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              return 'new_failure';
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `✅ The production website has recovered. Recovery confirmed at: ${report?.checkedAt || new Date().toISOString()}.\n\nMonitoring run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: 'closed',
                state_reason: 'completed',
              });
              return 'recovered';
            }

            return 'healthy';

      - name: Mark only a newly detected incident as failed
        if: steps.incident.outputs.result == 'new_failure'
        run: exit 1

  browser-smoke:
    name: Real browser navigation, forms and WhatsApp smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run production browser smoke tests
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://flashcast.com.my
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: npm run test:e2e -- e2e/smoke.spec.ts --project=chromium --retries=1

      - name: Upload browser traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-smoke-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Open, update or close browser incident
        id: browser-incident
        if: always()
        uses: actions/github-script@v9
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          MONITOR_BASE_URL: ${{ env.MONITOR_BASE_URL }}
        with:
          result-encoding: string
          script: |
            const marker = '<!-- flashcast-monitor:browser -->';
            const title = '[Website Monitoring] FLASH CAST Browser Smoke Incident';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.BROWSER_OUTCOME !== 'success';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.body?.includes(marker));

            if (failed) {
              const body = [
                marker,
                '## FLASH CAST Browser Smoke Alert',
                '',
                `- Site: ${process.env.MONITOR_BASE_URL}`,
                `- Last detected: ${new Date().toISOString()}`,
                `- GitHub Actions run: ${runUrl}`,
                '',
                'The browser smoke covers Chinese and English pages, mobile navigation, quote and contact form interaction states, WhatsApp links, and unauthenticated admin-route protection. Form submissions are intercepted and mocked, so no real customer data is written.',
                '',
                'This issue will be updated while the incident continues and closed automatically after the next successful full browser smoke.',
              ].join('\n');

              if (incident) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  title,
                  body,
                });
                return 'ongoing_failure';
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              return 'new_failure';
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `✅ The browser smoke has recovered. Recovery confirmed at: ${new Date().toISOString()}.\n\nMonitoring run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: 'closed',
                state_reason: 'completed',
              });
              return 'recovered';
            }

            return 'healthy';

      - name: Mark only a newly detected browser incident as failed
        if: steps.browser-incident.outputs.result == 'new_failure'
        run: exit 1
