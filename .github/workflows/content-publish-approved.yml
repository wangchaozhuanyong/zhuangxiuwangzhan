name: Approved website content publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only, or publish approved content to production."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      target:
        description: "Approved content target."
        required: true
        default: all-20260906
        type: choice
        options:
          - all-20260906
          - topic-cluster-links-20260907
          - kitchen
          - old-house-renovation-checklist
          - old-house-renovation-hidden-costs-malaysia
          - malaysia-renovation-budget-guide
          - kitchen-renovation-quotation-checklist-malaysia
          - bathroom-waterproofing-drainage-planning-malaysia
          - office-fit-out-me-it-planning-checklist-malaysia
          - restaurant-fit-out-planning-checklist-malaysia
          - builtin-whole-house-custom-v1
          - en-renovation-owner-cms-v2
          - pg002-shop-cms-v1
          - kitchen-r1-cms-row-20260924-v1
          - design-r1-cms-row-20260924-v1
          - selangor-service-area-r1-v4
          - org-017-bathroom-faq-parity-reconciliation-v4
          - blog-kitchen-cabinet-cost-r1-v1
          - blog-renovation-quotation-links-r1-v1
          - blog-office-checklist-links-r1-v1
          - office-service-scope-r1-v1
          - kl-location-intent-r1-v2
          - org026-builtin-media-r1-v5
          - org026-warehouse-media-r1-v6
          - org026-office-renovation-media-r1-v6
          - blog-kitchen-cabinet-media-r1-v1
          - blog-office-checklist-media-r1-v1
          - org020-shop-intent-body-r1-v7
          - org020-zh-renovation-study-room-r1-v7
          - org020-budget-timeline-r1-v7
          - org020-area-ampang-prune-r1-v7
          - org020-area-ara-damansara-prune-r1-v7
          - org020-area-bangsar-prune-r1-v7
          - org020-area-bukit-jalil-prune-r1-v7
          - org020-area-cheras-prune-r1-v7
          - org020-area-cyberjaya-prune-r1-v7
          - org020-area-damansara-prune-r1-v7
          - org020-area-kepong-prune-r1-v7
          - org020-area-kota-damansara-prune-r1-v7
          - org020-area-mont-kiara-prune-r1-v7
          - org020-area-petaling-jaya-prune-r1-v7
          - org020-area-puchong-prune-r1-v7
          - org020-area-selangor-prune-r1-v7
          - org020-area-setapak-prune-r1-v7
          - org020-area-setia-alam-prune-r1-v7
          - org020-area-shah-alam-prune-r1-v7
          - org020-area-sri-petaling-prune-r1-v7
          - org020-area-subang-jaya-prune-r1-v7
          - org020-general-quote-30km-answer-r1-v8
          - org020-home-quote-30km-answer-r1-v8
          - org020-home-one-year-warranty-answer-r1-v8
          - org020-locations-hub-availability-r1-v7
          - org020-coating-fact-safe-body-r1-v7
          - org020-condo-current-sources-r1-v7
          - org020-dbkl-current-sources-r1-v7
      approval_id:
        description: "Owner authorization reference used in the audit log."
        required: true
        default: owner-standing-flashcast-site-publish-20260906
        type: string
      managed_permit_id:
        description: "Exact single-use permit UUID for one locked CMS target."
        required: false
        type: string
      managed_operation:
        description: "Publish the locked candidate or restore its exact prior CMS version."
        required: true
        default: publish
        type: choice
        options:
          - publish
          - rollback
      parent_run_id:
        description: "Completed publish run containing the immutable prior-record artifact; rollback only."
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: approved-content-publish-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Reject unverified locked-target writes before loading production credentials
        env:
          PUBLISH_MODE: ${{ inputs.mode }}
          PUBLISH_TARGET: ${{ inputs.target }}
          MANAGED_PERMIT_ID: ${{ inputs.managed_permit_id }}
          MANAGED_OPERATION: ${{ inputs.managed_operation }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$MANAGED_OPERATION" = "rollback" ]; then
            case "$PUBLISH_TARGET" in
              builtin-whole-house-custom-v1|en-renovation-owner-cms-v2|pg002-shop-cms-v1|kitchen-r1-cms-row-20260924-v1|design-r1-cms-row-20260924-v1|selangor-service-area-r1-v4|org-017-bathroom-faq-parity-reconciliation-v4|blog-kitchen-cabinet-cost-r1-v1|blog-renovation-quotation-links-r1-v1|blog-office-checklist-links-r1-v1|office-service-scope-r1-v1|kl-location-intent-r1-v2) ;;
              *) echo "::error::Rollback is limited to locked CMS candidates."; exit 1 ;;
            esac
            if ! [[ "$PARENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Rollback requires the exact completed parent run ID."
              exit 1
            fi
          fi
          if [ "$PUBLISH_MODE" = "publish" ]; then
            case "$PUBLISH_TARGET" in
              builtin-whole-house-custom-v1|en-renovation-owner-cms-v2|pg002-shop-cms-v1|kitchen-r1-cms-row-20260924-v1|design-r1-cms-row-20260924-v1|selangor-service-area-r1-v4|org-017-bathroom-faq-parity-reconciliation-v4|blog-kitchen-cabinet-cost-r1-v1|blog-renovation-quotation-links-r1-v1|blog-office-checklist-links-r1-v1|office-service-scope-r1-v1|kl-location-intent-r1-v2|org026-builtin-media-r1-v5|org026-warehouse-media-r1-v6|org026-office-renovation-media-r1-v6|blog-kitchen-cabinet-media-r1-v1|blog-office-checklist-media-r1-v1|org020-shop-intent-body-r1-v7|org020-zh-renovation-study-room-r1-v7|org020-budget-timeline-r1-v7|org020-area-ampang-prune-r1-v7|org020-area-ara-damansara-prune-r1-v7|org020-area-bangsar-prune-r1-v7|org020-area-bukit-jalil-prune-r1-v7|org020-area-cheras-prune-r1-v7|org020-area-cyberjaya-prune-r1-v7|org020-area-damansara-prune-r1-v7|org020-area-kepong-prune-r1-v7|org020-area-kota-damansara-prune-r1-v7|org020-area-mont-kiara-prune-r1-v7|org020-area-petaling-jaya-prune-r1-v7|org020-area-puchong-prune-r1-v7|org020-area-selangor-prune-r1-v7|org020-area-setapak-prune-r1-v7|org020-area-setia-alam-prune-r1-v7|org020-area-shah-alam-prune-r1-v7|org020-area-sri-petaling-prune-r1-v7|org020-area-subang-jaya-prune-r1-v7|org020-general-quote-30km-answer-r1-v8|org020-home-quote-30km-answer-r1-v8|org020-home-one-year-warranty-answer-r1-v8|org020-locations-hub-availability-r1-v7|org020-coating-fact-safe-body-r1-v7|org020-condo-current-sources-r1-v7|org020-dbkl-current-sources-r1-v7)
                if ! [[ "$MANAGED_PERMIT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
                  echo "::error::A valid single-use managed permit ID is required."
                  exit 1
                fi
                ;;
              *)
                if [ "$MANAGED_OPERATION" = "rollback" ]; then
                  echo "::error::Rollback is limited to locked CMS candidates."
                  exit 1
                fi
                ;;
            esac
          fi

      - name: Download exact parent-run backup for managed rollback
        if: ${{ inputs.managed_operation == 'rollback' }}
        uses: actions/download-artifact@v4
        with:
          name: approved-content-publish-${{ inputs.parent_run_id }}
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: audits/parent-${{ inputs.parent_run_id }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm production source and required secrets
        env:
          CONTENT_PUBLISH_SECRET: ${{ secrets.CONTENT_PUBLISH_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CONTENT_PUBLISH_SECRET"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Validate or publish approved updates
        env:
          CONTENT_PUBLISH_SECRET: ${{ secrets.CONTENT_PUBLISH_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://flashcast.com.my
          PUBLISH_MODE: ${{ inputs.mode }}
          PUBLISH_TARGET: ${{ inputs.target }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          MANAGED_PERMIT_ID: ${{ inputs.managed_permit_id }}
          MANAGED_OPERATION: ${{ inputs.managed_operation }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
        run: |
          if [ "$PUBLISH_TARGET" = "all-20260906" ]; then
            TARGETS="kitchen old-house-renovation-checklist old-house-renovation-hidden-costs-malaysia"
          elif [ "$PUBLISH_TARGET" = "topic-cluster-links-20260907" ]; then
            TARGETS="malaysia-renovation-budget-guide kitchen-renovation-quotation-checklist-malaysia bathroom-waterproofing-drainage-planning-malaysia office-fit-out-me-it-planning-checklist-malaysia restaurant-fit-out-planning-checklist-malaysia"
          else
            TARGETS="$PUBLISH_TARGET"
          fi

          if [ "$MANAGED_OPERATION" != "rollback" ]; then
            for CONTENT_TARGET in $TARGETS; do
              npm run content:trust-fixes -- --target="$CONTENT_TARGET" --artifact-dir="audits/content-publish-${GITHUB_RUN_ID}"
            done
          else
            npm run content:trust-fixes -- --target="$PUBLISH_TARGET" --rollback-from="audits/parent-${PARENT_RUN_ID}/${PUBLISH_TARGET}/backup.json" --artifact-dir="audits/content-publish-${GITHUB_RUN_ID}"
          fi

          if [ "$PUBLISH_MODE" != "publish" ]; then
            exit 0
          fi

          for CONTENT_TARGET in $TARGETS; do
            extra_args=()
            if [ "$MANAGED_OPERATION" = "rollback" ]; then
              extra_args+=("--rollback-from=audits/parent-${PARENT_RUN_ID}/${CONTENT_TARGET}/backup.json")
            fi
            npm run content:trust-fixes -- --target="$CONTENT_TARGET" --execute --approval-id="$APPROVAL_ID" --managed-permit-id="$MANAGED_PERMIT_ID" "${extra_args[@]}" --artifact-dir="audits/content-publish-${GITHUB_RUN_ID}"
          done

      - name: Upload audit package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: approved-content-publish-${{ github.run_id }}
          path: audits/content-publish-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
