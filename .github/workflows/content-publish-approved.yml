name: Approved website content publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only, or publish approved content to production."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      target:
        description: "Approved content target."
        required: true
        default: all-20260906
        type: choice
        options:
          - all-20260906
          - kitchen
          - old-house-renovation-checklist
          - old-house-renovation-hidden-costs-malaysia
      approval_id:
        description: "Owner authorization reference used in the audit log."
        required: true
        default: owner-standing-flashcast-site-publish-20260906
        type: string

permissions:
  contents: read

concurrency:
  group: approved-content-publish-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Confirm production source and required secrets
        env:
          CONTENT_PUBLISH_SECRET: ${{ secrets.CONTENT_PUBLISH_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CONTENT_PUBLISH_SECRET"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Synchronize publisher authentication and deploy publisher
        env:
          CONTENT_PUBLISH_SECRET: ${{ secrets.CONTENT_PUBLISH_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set "CONTENT_PUBLISH_SECRET=$CONTENT_PUBLISH_SECRET" --project-ref rbsnyexjifounogswrjp
          supabase functions deploy content-publish --project-ref rbsnyexjifounogswrjp --no-verify-jwt --use-api

      - name: Validate or publish approved updates
        env:
          CONTENT_PUBLISH_SECRET: ${{ secrets.CONTENT_PUBLISH_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://flashcast.com.my
          PUBLISH_MODE: ${{ inputs.mode }}
          PUBLISH_TARGET: ${{ inputs.target }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          if [ "$PUBLISH_TARGET" = "all-20260906" ]; then
            TARGETS="kitchen old-house-renovation-checklist old-house-renovation-hidden-costs-malaysia"
          else
            TARGETS="$PUBLISH_TARGET"
          fi

          for CONTENT_TARGET in $TARGETS; do
            npm run content:trust-fixes -- --target="$CONTENT_TARGET" --artifact-dir="audits/content-publish-${GITHUB_RUN_ID}"
          done

          if [ "$PUBLISH_MODE" != "publish" ]; then
            exit 0
          fi

          for CONTENT_TARGET in $TARGETS; do
            npm run content:trust-fixes -- --target="$CONTENT_TARGET" --execute --approval-id="$APPROVAL_ID" --artifact-dir="audits/content-publish-${GITHUB_RUN_ID}"
          done

      - name: Upload audit package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: approved-content-publish-${{ github.run_id }}
          path: audits/content-publish-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
