name: Interaction standards
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  interaction-standards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:interaction-quality
      - run: npm run build:dev
      - run: npx vite build --mode production --outDir tmp/interaction-ci-dist
        env:
          VITE_SUPABASE_URL: https://interaction.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-ci-fixture
          VITE_APP_VERSION: interaction-ci
      - run: npm run verify:performance-budget
        env:
          PERFORMANCE_BUDGET_DIST_DIR: tmp/interaction-ci-dist
