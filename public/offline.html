<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>当前处于离线状态 | FLASH CAST</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111411; color: #f6f5ef; }
      main { width: min(100%, 560px); padding: 32px; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: #191d19; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      small { color: #d5ff3f; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 18px 0 12px; font-size: clamp(28px, 7vw, 44px); line-height: 1.08; }
      p { margin: 0; color: rgba(255,255,255,.7); line-height: 1.7; }
      p + p { margin-top: 10px; }
      a { min-height: 48px; width: fit-content; margin-top: 26px; padding: 0 24px; display: inline-flex; align-items: center; border-radius: 999px; background: #d5ff3f; color: #111411; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <small>FLASH CAST</small>
      <h1>当前网络不可用</h1>
      <p>为了避免显示过期的网页设计和内容，离线时不会继续使用旧 HTML。</p>
      <p lang="en">You are offline. Connect to the internet to load the latest website version.</p>
      <a href="/">重新连接 / Try again</a>
    </main>
  </body>
</html>
